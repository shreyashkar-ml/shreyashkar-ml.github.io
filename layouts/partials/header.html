{{- $currentPage := . -}}
<header class="header">
  <nav class="nav" aria-label="Primary navigation">
    <div class="desktop-nav">
      <div class="site-nav-links">
        {{- range site.Menus.main }}
        <a href="{{ .URL | relURL }}" class="{{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
        {{- end }}
      </div>
      <div class="social-links" aria-label="Social links">
        <a href="https://github.com/shreyashkar-ml" rel="noopener noreferrer" target="_blank" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 7.85c.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2" /></svg></a>
        <a href="https://www.linkedin.com/in/shreyashkar-sahu/" rel="noopener noreferrer" target="_blank" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.2H2V22h3.2zM3.6 2A1.9 1.9 0 1 0 3.6 5.8 1.9 1.9 0 0 0 3.6 2M22 13.9c0-4.15-2.21-6.08-5.16-6.08-2.38 0-3.44 1.31-4.03 2.23V8.2H9.62V22h3.2v-6.83c0-1.8.34-3.54 2.57-3.54 2.2 0 2.23 2.05 2.23 3.67V22H22z" /></svg></a>
        <a href="https://x.com/ShreyashkarLal" rel="noopener noreferrer" target="_blank" aria-label="Twitter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.25l-4.9-6.41L6.45 22H3.33l7.24-8.28L2.8 2h6.4l4.43 5.86L18.9 2Zm-1.1 17.9h1.73L8.27 3.98H6.42L17.8 19.9Z" /></svg></a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="true" aria-label="Switch to light mode"><span class="theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-label>light mode</span></button>
      </div>
    </div>
    <div class="mobile-nav">
      <a class="mobile-brand" href="{{ "/" | relURL }}">shreyashkar lal sahu</a>
      <div class="mobile-nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="true" aria-label="Switch to light mode"><span class="theme-toggle-icon" aria-hidden="true"></span><span class="theme-toggle-label" data-theme-toggle-label>light mode</span></button>
        <button class="menu-button" id="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <div class="mobile-menu-links">
        {{- range site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{- end }}
      </div>
      <div class="mobile-social-links social-links" aria-label="Social links">
        <a href="https://github.com/shreyashkar-ml" rel="noopener noreferrer" target="_blank" aria-label="GitHub">GitHub</a>
        <a href="https://www.linkedin.com/in/shreyashkar-sahu/" rel="noopener noreferrer" target="_blank" aria-label="LinkedIn">LinkedIn</a>
        <a href="https://x.com/ShreyashkarLal" rel="noopener noreferrer" target="_blank" aria-label="Twitter">Twitter</a>
      </div>
    </div>
  </nav>
</header>

<script>
  (() => {
    const preference = localStorage.getItem("pref-theme");
    const useDark = preference ? preference === "dark" : true;
    const setTheme = (dark, persist = false) => {
      document.documentElement.classList.toggle("dark", dark);
      document.body.classList.toggle("dark", dark);
      if (persist) localStorage.setItem("pref-theme", dark ? "dark" : "light");
      document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
        button.setAttribute("aria-pressed", String(dark));
        button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
        button.querySelector("[data-theme-toggle-label]").textContent = dark ? "light mode" : "dark mode";
      });
    };

    setTheme(useDark);
    document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
      button.addEventListener("click", () => setTheme(!document.documentElement.classList.contains("dark"), true));
    });
  })();

  const menuButton = document.getElementById("mobile-menu-toggle");
  const mobileMenu = document.getElementById("mobile-menu");
  if (menuButton && mobileMenu) {
    menuButton.addEventListener("click", () => {
      const isOpen = menuButton.getAttribute("aria-expanded") === "true";
      menuButton.setAttribute("aria-expanded", String(!isOpen));
      mobileMenu.setAttribute("aria-hidden", String(isOpen));
      document.body.classList.toggle("menu-open", !isOpen);
    });
  }
</script>
