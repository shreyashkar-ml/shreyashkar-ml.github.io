<script>
  (() => {
    if (window.__shareButtonsInitialized) return;
    window.__shareButtonsInitialized = true;

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-share-button]");
      if (!button) return;

      const label = button.querySelector("[data-share-label]");
      const url = new URL(button.dataset.sharePath, window.location.origin).href;
      try {
        if (navigator.share) {
          await navigator.share({ title: button.dataset.shareTitle, url });
          label.textContent = "shared";
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          label.textContent = "copied";
        } else {
          window.prompt("Copy this link", url);
        }
      } catch (error) {
        if (error.name === "AbortError") return;
        window.prompt("Copy this link", url);
      }

      window.setTimeout(() => { label.textContent = "share"; }, 1800);
    });
  })();
</script>
